[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "music"
dynamic = ["version"]
description = "Helper tools for music"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy<2",
    "scipy>=1.13.1",
    "matplotlib>=3.9.2",
]
[project.optional-dependencies]
app = [
    "flask>=3.0.3",
    "gunicorn",
]

[dependency-groups]
dev = [
    "setuptools",
    "pytest",
    "pytest-cov",
    "ruff<0.15",
    "ty",
]

[project.scripts]
music-cli = "music.cli:main"
music-app = "music.app:main"

[tool.hatch.version]
path = "src/music/__init__.py"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov=music"

[tool.coverage.report]
fail_under = 80
omit = [
    "*/music/app.py",
]

[tool.coverage.run]
patch = ["subprocess"]

[tool.tox]
env_list = ["3.12", "3.13", "3.14"]
isolated_build = true

[tool.tox.env_run_base]
extras = ['app']
dependency_groups = ['dev']
commands = [
    ["pytest"],
    #["ruff", "check"],
    #["ty", "check"]
]
