<!doctype html>

<head>
    <title>Music Helpers</title>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="color-scheme" content="light dark">
        <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">
        <link rel="stylesheet" href="{{ url_for('static', filename='custom.css') }}">
        <title>Hello world!</title>
    </head>
</head>
<body>
    <div id="loading-overlay" hidden>
        <div class="spinner"></div>
        <p>Computing...</p>
    </div>
    <h1>Music Helpers</h1>
    <p>This website provides tools for music:</p>
    <ul>
      <li><a href="{{ url_for('home') }}">Home</a></li>
      <li><a href="{{ url_for('guitar_positions') }}">Guitar Positions</a></li>
        <li><a href="{{ url_for('guitar_chord_progression') }}">Guitar Chord Progression</a></li>
      <li><a href="{{ url_for('voice_leading') }}">Voice Leading</a></li>
        <li><a href="{{ url_for('sonogram') }}">Sonogram</a></li>
    </ul>
    <hr>
    <div class="content">
        {% for message in get_flashed_messages() %}
            <div class="alert">{{ message }}</div>
        {% endfor %}

        {% block content %}
        {% endblock %}
    </div>

  <script>
    document.querySelectorAll("form").forEach((form) => {
      form.addEventListener("submit", () => {
        document.getElementById("loading-overlay").hidden = false;
      });
    });

    // Hide the spinner again if the user hits the browser Back button
    window.addEventListener("pageshow", () => {
      document.getElementById("loading-overlay").hidden = true;
    });
  </script>
</body>
