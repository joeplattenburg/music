{% extends "base.html" %}

{% block content %}
    <h2>{% block title %} Sonogram {% endblock %}</h2>
    <style>
        canvas { border: 2px solid black; cursor: crosshair; background: white; }
    </style>

    <body>
        <p>Draw a picture to convert to sound</p>

        <canvas id="canvas" width="400" height="300"></canvas>
        <br><br>

        <button onclick="clearCanvas()">Clear</button>
        <button onclick="synthesizeAudio()">Synthesize & Play</button>
        <br><br>

        <audio id="audioPlayer" controls></audio>

        <script>
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const audioPlayer = document.getElementById('audioPlayer');
            let isDrawing = false;

            initializeCanvas();
            function initializeCanvas() {
                ctx.fillStyle = "white";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            canvas.addEventListener('mousedown', () => isDrawing = true);
            canvas.addEventListener('mouseup', () => isDrawing = false);
            canvas.addEventListener('mousemove', draw);

            function draw(event) {
                if (!isDrawing) return;
                ctx.fillStyle = 'black';
                ctx.fillRect(event.offsetX, event.offsetY, 4, 4);
            }

            function clearCanvas() {
                ctx.fillStyle = "white";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            async function synthesizeAudio() {
                const imageDataUrl = canvas.toDataURL('image/png');
                const response = await fetch('/sonogram', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image_data: imageDataUrl })
                });

                const audioBlob = await response.blob();
                const blobUrl = URL.createObjectURL(audioBlob);

                audioPlayer.src = blobUrl;
                audioPlayer.play();
            }
        </script>
    </body>

{% endblock %}
