name: Release Package and Image

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  release-and-publish:
    if: |
      contains(github.event.head_commit.message, 'Merge branch ''release/') || 
      (contains(github.event.head_commit.message, 'Merge pull request') && contains(github.event.head_commit.message, 'release/'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Infer new version number
        run: |
          VERSION_NUM=$(grep "__version__" ${{ github.workspace }}/src/music/__init__.py | head -n 1 | cut -d'"' -f2 | cut -d"'" -f2 | tr -d '\r\n ')
          echo "VERSION=v$VERSION_NUM" >> $GITHUB_ENV

      - name: Generate Release Notes & Tag
        id: release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Build Wheel
        run: uv build

      - name: Upload Wheel to GitHub Release
        run: |
          gh release upload ${{ env.VERSION }} dist/*.whl dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.VERSION }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - run: echo "This job's status is ${{ job.status }}."
